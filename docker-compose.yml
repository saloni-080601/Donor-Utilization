services:
  db:
    image: postgres:16
    container_name: donor-uc-postgres
    environment:
      POSTGRES_USER: donor
      POSTGRES_PASSWORD: donor
      POSTGRES_DB: donor_uc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donor -d donor_uc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
